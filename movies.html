<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Películas — CineStream</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  background: #090b0f;
  font-family: 'Nunito', sans-serif;
  color: white;
}

/* HEADER */
header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  font-family: 'Oswald';
}

/* BUSCADOR */
.controls {
  display: flex;
  gap: 10px;
}

input, select {
  padding: 10px;
  border-radius: 6px;
  border: none;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #141920;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 260px;
  object-fit: cover;
}

.card-info {
  padding: 10px;
}

small {
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <h1>🎬 Películas</h1>

  <div class="controls">
    <input type="text" id="search" placeholder="Buscar...">
    <select id="genre">
      <option value="">Todos</option>
      <option>Acción</option>
      <option>Drama</option>
      <option>Comedia</option>
      <option>Terror</option>
      <option>Ciencia Ficción</option>
    </select>
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
const SUPABASE_URL = 'https://hitfonmtelltpesotuhd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYm10ZWxsdHBlc290dWhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzY0MjEsImV4cCI6MjA5MjkxMjQyMX0.Mc5r5VuIzZ27U0toY3WMD2dYdFFmix_1BHP84yIbVsQ';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let movies = [];

// 🔥 CARGAR
async function loadMovies() {
  const { data, error } = await db
    .from('movies')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  movies = data || [];
  renderMovies(movies);
}

// 🎬 RENDER
function renderMovies(list) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (list.length === 0) {
    grid.innerHTML = "<p>No hay películas</p>";
    return;
  }

  list.forEach(m => {
    grid.innerHTML += `
      <div class="card" onclick="watch('${m.video_url}')">
        <img src="${m.poster_url || 'https://via.placeholder.com/300x450'}">
        <div class="card-info">
          <b>${m.title}</b><br>
          <small>${m.year || ''} • ${m.genre || ''}</small>
        </div>
      </div>
    `;
  });
}

// ▶️ WATCH
function watch(url) {
  if (!url) {
    alert("Esta película no tiene video");
    return;
  }

  window.location.href = `watch.html?url=${encodeURIComponent(url)}&type=movie`;
}

// 🔎 FILTROS
document.getElementById('search').addEventListener('input', filter);
document.getElementById('genre').addEventListener('change', filter);

function filter() {
  const search = document.getElementById('search').value.toLowerCase();
  const genre = document.getElementById('genre').value;

  const filtered = movies.filter(m => {
    return m.title?.toLowerCase().includes(search) &&
      (genre === '' || m.genre === genre);
  });

  renderMovies(filtered);
}

// INIT
loadMovies();
</script>

</body>
</html>
