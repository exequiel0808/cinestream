<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importador M3U — CineStream</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#090b0f;
  color:white;
  font-family:Arial;
  padding:20px;
}
input,button{
  padding:10px;
  margin:5px 0;
}
button{
  background:#e50914;
  border:none;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>📡 Importar M3U</h2>

<input id="m3uUrl" placeholder="Pega tu URL M3U aquí">

<button onclick="fetchM3U()">Cargar lista</button>
<button onclick="startImport()">Importar</button>

<div id="result"></div>

<script>
const SUPABASE_URL = 'https://hitfonmtelltpesotuhd.supabase.co';
const SUPABASE_ANON_KEY = 'TU_KEY_AQUI';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let canales = [];

// 🔥 CARGAR M3U
async function fetchM3U(){
  const url = document.getElementById('m3uUrl').value;

  if(!url){
    alert("Pega la URL");
    return;
  }

  try{
    const res = await fetch(url);
    const text = await res.text();

    parseM3U(text);

  }catch(e){
    alert("Error al cargar (CORS o URL inválida)");
    console.error(e);
  }
}

// 🔥 PARSEAR
function parseM3U(text){

  const lines = text.split("\n");

  canales = [];
  let actual = null;

  lines.forEach(line => {

    if(line.startsWith("#EXTINF")){
      const name = line.split(",")[1] || "Sin nombre";
      actual = { name };
    }

    else if(line.startsWith("http") && actual){
      actual.stream_url = line.trim();
      canales.push(actual);
      actual = null;
    }

  });

  document.getElementById('result').innerHTML =
    "Canales encontrados: " + canales.length;
}

// 🔥 IMPORTAR A SUPABASE (CORREGIDO)
async function startImport(){

  if(canales.length === 0){
    alert("Primero carga la lista");
    return;
  }

  let insertados = 0;

  for(let c of canales.slice(0,200)){

    const { error } = await db.from('live_channels').insert({
      name: c.name,
      logo_url: null,
      category: "General",
      stream_url: c.stream_url
    });

    if(!error) insertados++;
  }

  alert("Importados: " + insertados);
}
</script>

</body>
</html>
