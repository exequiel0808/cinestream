<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — CineStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:       #090b0f;
      --bg2:      #0f1319;
      --bg3:      #141920;
      --accent:   #e50914;
      --accent-h: #f40612;
      --gold:     #f5a623;
      --text:     #f0f0f0;
      --text2:    #9ba3b2;
      --text3:    #5a6272;
      --border:   rgba(255,255,255,0.07);
      --radius:   12px;
      --font-h:   'Oswald', sans-serif;
      --font-b:   'Nunito', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-b);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Fondo animado */
    .bg-art {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 70% 50%, rgba(229,9,20,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 20% 80%, rgba(59,130,246,0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Card principal */
    .auth-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 20px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
      animation: cardIn 0.4s ease;
    }
    @keyframes cardIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .logo {
      font-family: var(--font-h);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .logo span { color: var(--text); }

    .auth-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text3);
      margin-bottom: 32px;
    }

    .auth-title {
      font-family: var(--font-h);
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }

    /* Campos */
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text2);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .field-wrap {
      position: relative;
    }
    .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      pointer-events: none;
    }
    .field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px 12px 40px;
      color: var(--text);
      font-family: var(--font-b);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }
    .field input:focus {
      border-color: rgba(229,9,20,0.5);
      background: rgba(255,255,255,0.04);
    }
    .field input::placeholder { color: var(--text3); }
    .field input.error { border-color: var(--accent); }

    /* Toggle contraseña */
    .toggle-pass {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      padding: 2px;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: var(--text2); }

    /* Forgot */
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      color: var(--text3);
      margin-top: 6px;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--accent); }

    /* Error message */
    .error-msg {
      background: rgba(229,9,20,0.1);
      border: 1px solid rgba(229,9,20,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.83rem;
      color: #ff6b6b;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .error-msg.show { display: flex; }

    /* Botón principal */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: var(--font-h);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--accent-h);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(229,9,20,0.35);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner { display: block; }
    .loading .btn-text { display: none; }

    /* Divisor */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--text3);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Link a registro */
    .auth-switch {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text2);
      margin-top: 20px;
    }
    .auth-switch a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .auth-switch a:hover { color: var(--accent-h); }

    /* Success state */
    .success-state {
      text-align: center;
      display: none;
      animation: cardIn 0.4s ease;
    }
    .success-state.show { display: block; }
    .success-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(22,163,74,0.15);
      border: 2px solid #16a34a;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.8rem;
    }
    .success-state h3 {
      font-family: var(--font-h);
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .success-state p { font-size: 0.87rem; color: var(--text2); }

    /* Back to home */
    .back-home {
      position: fixed;
      top: 20px; left: 24px;
      display: flex; align-items: center; gap: 6px;
      font-size: 0.83rem;
      color: var(--text3);
      text-decoration: none;
      transition: color 0.2s;
      z-index: 10;
    }
    .back-home:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="bg-art"></div>
  <div class="bg-grid"></div>

  <a href="index.html" class="back-home">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Volver al inicio
  </a>

  <div class="auth-card">

    <div class="logo">CINE<span>STREAM</span></div>
    <p class="auth-subtitle">Tu plataforma de streaming gratuita</p>

    <!-- Formulario -->
    <div id="formSection">
      <h2 class="auth-title">Iniciar sesión</h2>

      <div class="error-msg" id="errorMsg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText">Error al iniciar sesión.</span>
      </div>

      <div class="field">
        <label>Correo electrónico</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="emailInput" placeholder="tu@correo.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="passInput" placeholder="Tu contraseña" autocomplete="current-password" id="passInput">
          <button class="toggle-pass" onclick="togglePass()" type="button" id="toggleBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <a href="#" class="forgot-link" onclick="forgotPassword()">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn-submit" id="loginBtn" onclick="handleLogin()">
        <div class="spinner"></div>
        <span class="btn-text">Iniciar sesión</span>
      </button>

      <div class="divider">o</div>

      <p class="auth-switch">
        ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
      </p>
    </div>

    <!-- Estado de éxito -->
    <div class="success-state" id="successState">
      <div class="success-icon">✓</div>
      <h3>¡Bienvenido de vuelta!</h3>
      <p>Iniciando sesión, redirigiendo...</p>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://hitfonmtelltpesotuhd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpdGZvbm10ZWxsdHBlc290dWhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzY0MjEsImV4cCI6MjA5MjkxMjQyMX0.Mc5r5VuIzZ27U0toY3WMD2dYdFFmix_1BHP84yIbVsQ';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Si ya está logueado, redirigir
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      document.getElementById('errorText').textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }

    function setLoading(on) {
      const btn = document.getElementById('loginBtn');
      btn.disabled = on;
      btn.classList.toggle('loading', on);
    }

    async function handleLogin() {
      hideError();
      const email = document.getElementById('emailInput').value.trim();
      const pass  = document.getElementById('passInput').value;

      if (!email) { showError('Ingresa tu correo electrónico.'); return; }
      if (!pass)  { showError('Ingresa tu contraseña.'); return; }

      setLoading(true);
      try {
        const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;

        // Éxito
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('successState').classList.add('show');

        setTimeout(() => {
          const redirect = new URLSearchParams(window.location.search).get('redirect');
          window.location.href = redirect || 'index.html';
        }, 1200);

      } catch (err) {
        const msgs = {
          'Invalid login credentials': 'Correo o contraseña incorrectos.',
          'Email not confirmed': 'Debes confirmar tu correo antes de iniciar sesión.',
          'Too many requests': 'Demasiados intentos. Espera un momento.',
        };
        showError(msgs[err.message] || 'Error al iniciar sesión. Intenta de nuevo.');
        setLoading(false);
      }
    }

    // Enter para enviar
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    // Toggle contraseña
    let passVisible = false;
    function togglePass() {
      passVisible = !passVisible;
      const input = document.getElementById('passInput');
      input.type = passVisible ? 'text' : 'password';
      document.getElementById('eyeIcon').innerHTML = passVisible
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }

    // Olvidé contraseña
    async function forgotPassword() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) { showError('Ingresa tu correo primero para recuperar la contraseña.'); return; }
      try {
        await db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset.html' });
        hideError();
        alert('✉️ Te enviamos un correo para restablecer tu contraseña.');
      } catch(e) { showError('Error al enviar correo de recuperación.'); }
    }
  </script>
</body>
</html>
