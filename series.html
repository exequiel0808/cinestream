<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series — CineStream</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  background: #090b0f;
  color: white;
  font-family: 'Nunito';
}

header {
  padding: 20px;
  font-family: 'Oswald';
  display: flex;
  justify-content: space-between;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #141920;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 260px;
  object-fit: cover;
}

.info {
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>📺 Series</h1>
</header>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); padding:40px;">
  <div style="background:#141920; padding:20px; border-radius:10px; max-width:600px; margin:auto;">
    <h2 id="modalTitle"></h2>
    <div id="episodes"></div>
    <br>
    <button onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hitfonmtelltpesotuhd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYm10ZWxsdHBlc290dWhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzY0MjEsImV4cCI6MjA5MjkxMjQyMX0.Mc5r5VuIzZ27U0toY3WMD2dYdFFmix_1BHP84yIbVsQ';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadSeries() {
  const { data } = await db.from('series').select('*');

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  data.forEach(s => {
    grid.innerHTML += `
      <div class="card" onclick="openSeries('${s.id}', '${s.title}')">
        <img src="${s.poster_url}">
        <div class="info">
          <b>${s.title}</b><br>
          <small>${s.year}</small>
        </div>
      </div>
    `;
  });
}

async function openSeries(seriesId, title) {
  document.getElementById('modal').style.display = 'block';
  document.getElementById('modalTitle').innerText = title;

  const { data } = await db
    .from('episodes')
    .select('*')
    .eq('series_id', seriesId)
    .order('episode_number', { ascending: true });

  const container = document.getElementById('episodes');
  container.innerHTML = '';

  data.forEach(ep => {
    container.innerHTML += `
      <div style="margin-bottom:10px;">
        Episodio ${ep.episode_number} — ${ep.title}
        <button onclick="watch('${ep.video_url}')">Ver</button>
      </div>
    `;
  });
}

function watch(url) {
  window.location.href = `watch.html?url=${url}&type=series`;
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

loadSeries();
</script>

</body>
</html>
