<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil — CineStream</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  background: #090b0f;
  color: white;
  font-family: 'Nunito';
}

header {
  padding: 20px;
  font-family: 'Oswald';
  display: flex;
  justify-content: space-between;
}

.container {
  padding: 20px;
}

.section {
  margin-bottom: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
  gap: 15px;
}

.card {
  background: #141920;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}

button {
  background: #e50914;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1>👤 Mi Perfil</h1>
  <button onclick="logout()">Cerrar sesión</button>
</header>

<div class="container">

  <!-- INFO -->
  <div class="section">
    <h2>Datos</h2>
    <p id="email"></p>
  </div>

  <!-- FAVORITOS -->
  <div class="section">
    <h2>⭐ Favoritos</h2>
    <div class="grid" id="favorites"></div>
  </div>

  <!-- HISTORIAL -->
  <div class="section">
    <h2>⏱️ Continuar viendo</h2>
    <div class="grid" id="history"></div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://hitfonmtelltpesotuhd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYm10ZWxsdHBlc290dWhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzY0MjEsImV4cCI6MjA5MjkxMjQyMX0.Mc5r5VuIzZ27U0toY3WMD2dYdFFmix_1BHP84yIbVsQ';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user;

// ===== USUARIO =====
async function loadUser() {
  const { data: { user: u } } = await db.auth.getUser();

  if (!u) {
    window.location.href = "login.html";
    return;
  }

  user = u;
  document.getElementById('email').innerText = u.email;
}

// ===== FAVORITOS =====
async function loadFavorites() {
  const { data } = await db
    .from('favorites')
    .select('*')
    .eq('user_id', user.id);

  const container = document.getElementById('favorites');
  container.innerHTML = '';

  data.forEach(f => {
    container.innerHTML += `
      <div class="card" onclick="watch('${f.video_url}')">
        ${f.title}
      </div>
    `;
  });
}

// ===== HISTORIAL =====
async function loadHistory() {
  const { data } = await db
    .from('watch_history')
    .select('*')
    .eq('user_id', user.id);

  const container = document.getElementById('history');
  container.innerHTML = '';

  data.forEach(h => {
    container.innerHTML += `
      <div class="card" onclick="watch('${h.video_url}')">
        ${h.video_url}<br>
        ⏱ ${Math.floor(h.progress)}s
      </div>
    `;
  });
}

// ===== WATCH =====
function watch(url) {
  window.location.href = `watch.html?url=${url}`;
}

// ===== LOGOUT =====
async function logout() {
  await db.auth.signOut();
  window.location.href = "login.html";
}

// ===== INIT =====
async function init() {
  await loadUser();
  await loadFavorites();
  await loadHistory();
}

init();
</script>

</body>
</html>
