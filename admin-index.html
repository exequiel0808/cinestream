<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CineStream</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #090b0f;
      --bg2: #0f1319;
      --bg3: #141920;
      --accent: #e50914;
      --text: #f0f0f0;
      --text2: #9ba3b2;
      --border: rgba(255,255,255,0.07);
      --radius: 10px;
      --font-h: 'Oswald', sans-serif;
      --font-b: 'Nunito', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      font-family: var(--font-b);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 20px;
    }

    .logo {
      font-family: var(--font-h);
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 30px;
    }

    .menu a {
      display: block;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      color: var(--text2);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .header h1 {
      font-family: var(--font-h);
    }

    /* CARDS */
    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--bg2);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .card h3 {
      font-size: 0.9rem;
      color: var(--text2);
    }

    .card p {
      font-size: 1.6rem;
      font-weight: bold;
      margin-top: 10px;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      color: var(--text2);
    }

    /* BUTTON */
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">CINE<span style="color:white;">STREAM</span></div>

    <div class="menu">
      <a href="index.html" class="active">📊 Dashboard</a>
      <a href="movies.html">🎬 Películas</a>
      <a href="series.html">📺 Series</a>
      <a href="live.html">📡 TV en Vivo</a>
      <a href="users.html">👤 Usuarios</a>
      <a href="../index.html">🌐 Ir al sitio</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="header">
      <h1>Dashboard</h1>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="card">
        <h3>Películas</h3>
        <p id="moviesCount">0</p>
      </div>
      <div class="card">
        <h3>Series</h3>
        <p id="seriesCount">0</p>
      </div>
      <div class="card">
        <h3>Canales</h3>
        <p id="liveCount">0</p>
      </div>
      <div class="card">
        <h3>Usuarios</h3>
        <p id="usersCount">0</p>
      </div>
    </div>

    <!-- ÚLTIMAS PELÍCULAS -->
    <div class="card">
      <h3>Últimas películas</h3>
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Año</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody id="moviesTable"></tbody>
      </table>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://hitfonmtelltpesotuhd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpdGZvbm10ZWxsdHBlc290dWhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzY0MjEsImV4cCI6MjA5MjkxMjQyMX0.Mc5r5VuIzZ27U0toY3WMD2dYdFFmix_1BHP84yIbVsQ';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAdmin() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return location.href = '../login.html';

      const { data } = await db
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (!data || data.role !== 'admin') {
        location.href = '../index.html';
      }
    }

    async function loadStats() {
      const { count: movies } = await db.from('movies').select('*', { count: 'exact', head: true });
      const { count: series } = await db.from('series').select('*', { count: 'exact', head: true });
      const { count: live } = await db.from('live_channels').select('*', { count: 'exact', head: true });
      const { count: users } = await db.from('profiles').select('*', { count: 'exact', head: true });

      document.getElementById('moviesCount').textContent = movies || 0;
      document.getElementById('seriesCount').textContent = series || 0;
      document.getElementById('liveCount').textContent = live || 0;
      document.getElementById('usersCount').textContent = users || 0;
    }

    async function loadMovies() {
      const { data } = await db
        .from('movies')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(5);

      const table = document.getElementById('moviesTable');
      table.innerHTML = '';

      data.forEach(m => {
        table.innerHTML += `
          <tr>
            <td>${m.title}</td>
            <td>${m.year}</td>
            <td>${m.rating}</td>
          </tr>
        `;
      });
    }

    async function logout() {
      await db.auth.signOut();
      location.href = '../login.html';
    }

    checkAdmin();
    loadStats();
    loadMovies();
  </script>

</body>
</html>
